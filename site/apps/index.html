:root{--ink:#10101b;--violet:#514eff;--deep:#4b4aef;--paper:#f7f6ff;--line:rgba(19,17,42,.12);--muted:#5d5a72;--yellow:#ffd365;--soft:#efedff}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 Manrope,"Segoe UI",system-ui,sans-serif}

.langs{display:flex;gap:6px;flex-wrap:wrap}
.langs button{font:inherit;cursor:pointer;color:#fff;background:none;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.langs button[aria-current=true]{background:#fff;color:var(--deep)}
h1{font:900 clamp(36px,6vw,64px)/1 "Nunito",system-ui,sans-serif;letter-spacing:-.04em;margin:46px 0 12px}
header p{max-width:660px;color:rgba(255,255,255,.88);font-size:18px;margin:0}
main{max-width:920px;margin:-64px auto 60px;padding:0 16px}

h2{font:800 24px/1.2 "Nunito",system-ui,sans-serif;margin:0 0 8px}
h3{font:800 18px/1.3 "Nunito",system-ui,sans-serif;margin:0 0 4px}
.muted,small{color:var(--muted)}
/* choose your tv */
.pick{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.device{display:flex;flex-direction:column;gap:10px;text-align:left;font:inherit;color:inherit;cursor:pointer;background:#fff;border:2px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 18px 40px rgba(38,26,120,.06);transition:border-color .15s,transform .15s}
.device:hover{transform:translateY(-2px)}
.device[aria-pressed=true]{border-color:var(--violet);box-shadow:0 18px 40px rgba(81,78,255,.18)}
.device .icon{width:52px;height:52px;border-radius:16px;background:var(--soft);display:grid;place-items:center;color:var(--violet)}
.device b{font:800 20px/1.2 "Nunito",system-ui,sans-serif}
.device span{color:var(--muted);font-size:14px}
.release{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.button{display:inline-flex;align-items:center;gap:10px;border-radius:999px;padding:13px 20px;font-weight:800;text-decoration:none;background:var(--violet);color:#fff;box-shadow:0 10px 24px rgba(81,78,255,.3)}
.button.ghost{background:#fff;color:var(--violet);border:1px solid var(--line);box-shadow:none}
.button svg{width:18px;height:18px}
.version{font-size:14px;color:var(--muted)}
/* steps */
.part{margin:28px 0 10px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.part h2{margin:0}
.tag{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--violet);background:var(--soft);border-radius:999px;padding:4px 10px}
ol.steps{list-style:none;margin:0;padding:0;counter-reset:s}
ol.steps>li{position:relative;counter-increment:s;background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 20px 18px 76px;margin-bottom:10px}
ol.steps>li::before{content:counter(s);position:absolute;left:20px;top:18px;width:38px;height:38px;border-radius:12px;background:var(--violet);color:#fff;display:grid;place-items:center;font:900 17px "Nunito",system-ui,sans-serif}
ol.steps p{margin:2px 0 0;color:#2c2a40}
.path{display:inline;font-weight:700;color:var(--ink);background:var(--soft);border-radius:8px;padding:1px 7px;line-height:1.9}
kbd{font:800 13px/1 system-ui,sans-serif;border:1px solid var(--line);border-bottom-width:3px;border-radius:7px;padding:3px 7px;background:#fff}
.code{display:inline-block;font:900 26px/1 "Nunito",system-ui,sans-serif;letter-spacing:.02em;color:var(--deep);background:var(--soft);border:2px dashed #c9c5ff;border-radius:14px;padding:10px 16px;margin-top:8px}
.note{border-left:4px solid var(--yellow)}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-weight:700;margin:18px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
details{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 20px;margin-bottom:10px}
summary{cursor:pointer;font-weight:800}
details p{margin:8px 0 2px}
footer{text-align:center;color:var(--muted);font-size:14px;padding:0 16px 40px}
[hidden]{display:none!important}
@media(max-width:640px){.pick{grid-template-columns:1fr}ol.steps>li{padding:66px 16px 16px}ol.steps>li::before{left:16px;top:16px}}

var LOCALE = { nl: "nl-BE", fr: "fr-BE", en: "en-GB", de: "de-DE" };
var lang = "nl", device = "android", release = null;

function part(p) {
  return '<div class="part"><span class="tag">' + p.tag + '</span><h2>' + p.title + '</h2></div><ol class="steps">' +
    p.steps.map(function (s) { return '<li><h3>' + s[0] + '</h3><p>' + s[1] + '</p></li>'; }).join("") + '</ol>';
}
function render() {
  var t = T[lang];
  document.documentElement.lang = lang;
  document.title = "Zono TV · " + t.title;
  document.querySelectorAll("[data-t]").forEach(function (e) { e.innerHTML = t[e.getAttribute("data-t")]; });
  document.querySelectorAll("[data-pick]").forEach(function (b) { b.setAttribute("aria-current", String(b.getAttribute("data-pick") === lang)); });
  document.querySelectorAll("[data-device]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-device") === device)); });
  var android = device === "android";
  document.getElementById("get").href = GH + (android ? "Zono-TV.apk" : "Zono-TV.ipk");
  document.getElementById("get-label").textContent = android ? t.getApk : t.getIpk;
  var html = android ? part(t.ad) + '<div class="or">' + (lang === "fr" ? "ou" : lang === "de" ? "oder" : lang === "en" ? "or" : "of") + '</div>' + part(t.au)
    : part(t.lg[0]) + part(t.lg[1]) + '<div class="card note" style="margin-top:6px">' + t.lgNote + '</div>';
  document.getElementById("steps").innerHTML = html + part(t.login);
  document.getElementById("faq").innerHTML = t.faq.map(function (q) { return "<details><summary>" + q[0] + "</summary><p>" + q[1] + "</p></details>"; }).join("");
  showVersion();
}
function showVersion() {
  if (!release) return;
  var bytes = release[device === "android" ? "apk" : "ipk"];
  var when = new Date(release.date + "T12:00:00").toLocaleDateString(LOCALE[lang], { day: "numeric", month: "long", year: "numeric" });
  document.getElementById("version").textContent = T[lang].version + " " + release.version + " · " + when + (bytes ? " · " + (bytes / 1048576).toFixed(1) + " MB" : "");
}
document.querySelectorAll("[data-pick]").forEach(function (b) { b.onclick = function () {
  lang = b.getAttribute("data-pick"); try { localStorage.setItem("zono-language", lang); } catch (e) {} render();
}; });
document.querySelectorAll("[data-device]").forEach(function (b) { b.onclick = function () {
  device = b.getAttribute("data-device"); history.replaceState(null, "", "#" + device); render();
}; });
(function () {
  var pick = new URLSearchParams(location.search).get("lang");
  try { pick = pick || localStorage.getItem("zono-language"); } catch (e) {}
  if (!T[pick]) { var b = (navigator.language || "nl").slice(0, 2); pick = T[b] ? b : "nl"; }
  lang = pick;
  if (location.hash === "#lg" || (!location.hash && /web0s|webos|netcast/i.test(navigator.userAgent))) device = "lg";
  render();
  fetch("https://raw.githubusercontent.com/scoutr2019/zono/main/tv/version.json", { cache: "no-store" })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (data) { if (data && data.version) { release = data; showVersion(); } else document.getElementById("version").textContent = ""; })
    .catch(function () { document.getElementById("version").textContent = ""; });
})();
