<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zono · je eigen tv, op elk scherm</title>
<meta name="description" content="Zono speelt je eigen IPTV-abonnement af op Windows, LG en Android TV. Begin op het ene scherm, kijk verder op het andere.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDI0IDEwMjQiPgogIDxyZWN0IHg9IjY0IiB5PSI2NCIgd2lkdGg9Ijg5NiIgaGVpZ2h0PSI4OTYiIHJ4PSIyNDUiIGZpbGw9IiM1MzUwZjYiLz4KICA8cGF0aCBkPSJNMzA0IDM0MEg3MTVWNDM4TDQ0OSA2OTdINzE4Vjc5OEgzMDFWNjk2TDU2OCA0MzhIMzA0WiIgZmlsbD0iI2ZmZiIvPgogIDxjaXJjbGUgY3g9Ijc0OSIgY3k9Ijc3MCIgcj0iNDkiIGZpbGw9IiNmZmQzNjUiLz4KPC9zdmc+Cg==">
<link rel="preload" href="/fonts/Nunito-900.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/site.css">
<style>
:root{--muted:#45426a}
.hero h2,.devices h2,.together h2,.tour h2,.news h2,.faq h2{font-size:clamp(34px,4.6vw,54px);line-height:1.02}
h3{font-size:22px;font-weight:800;letter-spacing:-.01em}


/* ---- hero */
.hero{background:radial-gradient(1200px 600px at 75% 15%,#2b2670 0,transparent 60%),var(--night);color:#fff;padding:150px 0 110px;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1fr 1.15fr;gap:56px;align-items:center}
.hero h1{font-size:clamp(46px,6.6vw,86px);line-height:.95}
.hero h1 span{display:block}
.hero .lead{font-size:20px;color:rgba(255,255,255,.8);max-width:500px;margin:26px 0 34px}
.hero .actions{display:flex;flex-wrap:wrap;gap:12px}
.hero .note{font-size:14px;color:var(--mist);margin-top:22px;max-width:460px}
.hero .note b{color:#fff;font-weight:500}
.release{font-size:14px;color:var(--mist);margin-top:10px;min-height:1.6em}

/* screens: a laptop and a TV, the yellow dot travels from one to the other */
.screens{position:relative;aspect-ratio:1.18}
.tv{position:absolute;right:0;top:0;width:88%}
.tv .panel{background:#05040f;border-radius:14px;padding:9px;box-shadow:0 40px 80px rgba(5,3,30,.55)}
.tv .panel{position:relative}
.tv .panel img{border-radius:6px;aspect-ratio:16/9;object-fit:cover;width:100%;background:#0d0b22}
.tv .panel img.next{position:absolute;left:9px;top:9px;width:calc(100% - 18px);opacity:0;transition:opacity .8s ease}
.tv .panel img.next.on{opacity:1}
.tv .foot{width:34%;height:14px;margin:0 auto;background:linear-gradient(#2a2752,#14122e);border-radius:0 0 10px 10px}
.laptop{position:absolute;left:0;bottom:0;width:54%}
.laptop .lid{background:#0b0a1c;border-radius:12px 12px 0 0;padding:8px 8px 10px;box-shadow:0 30px 60px rgba(5,3,30,.6)}
.laptop .lid img{border-radius:4px;aspect-ratio:16/10;object-fit:cover;object-position:left top;width:100%;background:#0d0b22}
.laptop .base{height:14px;background:linear-gradient(#cfcdea,#8f8cc0);border-radius:0 0 14px 14px;margin:0 -6%}
.chip{position:absolute;display:flex;align-items:center;gap:12px;background:#fff;color:var(--ink);border-radius:14px;padding:10px 14px 12px;box-shadow:0 14px 34px rgba(5,3,30,.4);font-size:14px;line-height:1.3;width:max-content;max-width:260px}
.chip b{display:block;font-family:var(--display);font-weight:800;font-size:16px}
.chip i{display:block;height:4px;border-radius:4px;background:#e6e5f7;margin-top:6px;overflow:hidden;width:160px}
.chip i::after{content:"";display:block;height:100%;width:38%;background:var(--violet)}
.chip.from{left:6%;bottom:31%}
.chip.to{right:7%;top:38%;opacity:0}
.trail{position:absolute;inset:0;pointer-events:none;overflow:visible}
.trail path{fill:none;stroke:rgba(255,211,77,.45);stroke-width:2;stroke-dasharray:4 7;stroke-dashoffset:0}
.play .chip.to{animation:arrive .5s 3.3s ease-out forwards}
@keyframes arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.chip.to{opacity:1}.play .chip.to{animation:none}}
@media (prefers-reduced-motion:no-preference){
  /* the page opens: the words rise, the screens slide in, then the dot travels */
  .hero h1 span,.hero .lead,.hero .actions,.hero .release,.hero .note{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
  .hero h1 span:nth-child(2){animation-delay:.12s}
  .hero .lead{animation-delay:.25s}.hero .actions{animation-delay:.38s}.hero .release,.hero .note{animation-delay:.5s}
  .tv{animation:fromRight 1s .2s cubic-bezier(.2,.7,.2,1) both}
  .laptop{animation:fromBelow 1s .4s cubic-bezier(.2,.7,.2,1) both}
  .chip.from{animation:pop .5s 1.1s cubic-bezier(.3,1.4,.5,1) both}
  .chip.to i::after{transition:width 1.2s .3s ease}
  .chip.to.go i::after{width:60%}
  .hero .btn.sun{animation:rise .8s .38s cubic-bezier(.2,.7,.2,1) both,glow 2.8s 4s ease-in-out infinite}
  /* "stop here, continue there": the pc card fills, the dot runs down, the tv card lights up, again and again */
  .together.seen .card:first-child i::after{animation:fill 6s ease-in-out infinite}
  .together.seen .runner{animation:run 6s ease-in-out infinite}
  .together.seen .card.later{animation:light 6s ease-in-out infinite}
  .together.seen .card.later i::after{animation:fill2 6s ease-in-out infinite}
  /* the toestellen and the extra features arrive one after the other when you scroll to them */
  .reveal > *{opacity:0;transform:translateY(22px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.2,1)}
  .reveal.seen > *{opacity:1;transform:none}
  .reveal.seen > :nth-child(2){transition-delay:.12s}.reveal.seen > :nth-child(3){transition-delay:.24s}.reveal.seen > :nth-child(4){transition-delay:.36s}
  .device:hover .icon{animation:nudge .5s ease}
  .tour .steps button[aria-pressed=true] + .timer{animation:timer 5s linear forwards}
  .tour.stopped .steps .timer{animation:none!important;width:0}
}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes fromRight{from{opacity:0;transform:translateX(60px) rotate(1.5deg)}to{opacity:1;transform:none}}
@keyframes fromBelow{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,211,77,0)}50%{box-shadow:0 0 0 10px rgba(255,211,77,.18)}}
@keyframes fill{0%{width:0}35%,100%{width:38%}}
@keyframes run{0%,35%{top:72px;opacity:0}40%{opacity:1}62%{top:calc(100% - 72px);opacity:1}68%,100%{top:calc(100% - 72px);opacity:0}}
@keyframes light{0%,60%{border-color:var(--line-dark);box-shadow:none}68%,92%{border-color:rgba(255,211,77,.7);box-shadow:0 0 0 4px rgba(255,211,77,.12)}100%{border-color:var(--line-dark);box-shadow:none}}
@keyframes fill2{0%,62%{width:0}75%,100%{width:38%}}
@keyframes nudge{0%,100%{transform:none}30%{transform:translateY(-5px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}
@keyframes timer{from{width:0}to{width:100%}}

/* ---- choose your screen */
.devices{padding:110px 0 90px}
.devices .intro{display:flex;justify-content:space-between;align-items:end;gap:30px;margin-bottom:46px}
.devices .intro p{max-width:420px;color:var(--muted)}
.row{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid var(--ink)}
.device{padding:30px 30px 34px 0;display:flex;flex-direction:column;gap:14px}
.device + .device{padding-left:30px;border-left:1px solid var(--line)}
.device .icon{width:46px;height:46px;color:var(--violet)}
.device p{color:var(--muted);font-size:16px;flex:1}
.device .version{font-size:13px;color:var(--muted);min-height:1.5em}
.device .btns{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.device code{font:700 15px/1 var(--display);background:#e9e8ff;color:var(--violet);border-radius:7px;padding:3px 7px}

/* ---- continue elsewhere */
.together{background:var(--night);color:#fff;padding:110px 0;position:relative;overflow:hidden}
.together .wrap{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center}
.together p.lead{color:rgba(255,255,255,.78);font-size:19px;margin:22px 0 30px;max-width:520px}
.together ul{list-style:none;margin:0;padding:0;display:grid;gap:18px}
.together li{display:grid;grid-template-columns:28px 1fr;gap:14px;color:rgba(255,255,255,.86)}
.together li svg{width:24px;height:24px;color:var(--sun);margin-top:2px}
.together li b{color:#fff;font-weight:700}
.handoff{position:relative;display:grid;gap:18px}
.card{background:var(--night-2);border:1px solid var(--line-dark);border-radius:18px;padding:22px 24px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.card .where{width:48px;height:48px;border-radius:12px;background:rgba(140,138,252,.16);display:grid;place-items:center;color:var(--violet-soft)}
.card .where svg{width:26px;height:26px}
.card b{font-family:var(--display);font-weight:800;font-size:19px}
.card span{display:block;color:var(--mist);font-size:15px}
.card i{display:block;height:5px;background:rgba(255,255,255,.12);border-radius:5px;margin-top:10px;overflow:hidden}
.card i::after{content:"";display:block;height:100%;width:38%;background:var(--sun)}
.card.later{margin-left:12%}
.card.later i::after{background:var(--violet-soft)}
.handoff .link{position:absolute;left:47px;top:72px;bottom:72px;border-left:2px dashed rgba(255,211,77,.5)}
.handoff .runner{position:absolute;left:48px;top:72px;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 6px rgba(255,211,77,.18),0 0 20px rgba(255,211,77,.7);opacity:0}

/* ---- tour */
.tour{padding:110px 0}
.tour .wrap{display:grid;grid-template-columns:.9fr 1.3fr;gap:60px;align-items:start}
.tour .wrap.extra{display:block}
.tour .steps{list-style:none;margin:30px 0 0;padding:0;border-top:1px solid var(--line)}
.tour .steps button{all:unset;box-sizing:border-box;display:block;width:100%;padding:18px 0;border-bottom:1px solid var(--line);cursor:pointer}
.tour .steps b{font-family:var(--display);font-weight:800;font-size:20px;display:flex;justify-content:space-between;align-items:center}
.tour .steps b::after{content:"";width:10px;height:10px;border-radius:50%;background:transparent;border:2px solid var(--line)}
.tour .steps span{display:block;color:var(--muted);font-size:16px;margin-top:4px}
.tour .steps button[aria-pressed=true] b{color:var(--violet)}
.tour .steps button[aria-pressed=true] b::after{background:var(--sun);border-color:var(--sun)}
.tour .steps li{position:relative}
.tour .steps .timer{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:var(--violet)}
.stage img{transition:opacity .35s ease}
.stage img.fade{opacity:0}
.tour .steps button:focus-visible{outline:3px solid var(--violet);outline-offset:4px}
.stage{position:sticky;top:30px}
.stage .panel{background:#05040f;border-radius:16px;padding:10px;box-shadow:0 30px 60px rgba(22,19,58,.25)}
.stage img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:7px;background:#0d0b22}
.stage .foot{width:30%;height:14px;margin:0 auto;background:linear-gradient(#cfcdea,#9a97c6);border-radius:0 0 10px 10px}
.more{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 34px;margin-top:56px;padding-top:34px;border-top:2px solid var(--ink)}
.more div{display:grid;grid-template-columns:30px 1fr;gap:12px}
.more svg{width:24px;height:24px;color:var(--violet);margin-top:3px}
.more b{display:block;font-weight:700}
.more span{color:var(--muted);font-size:16px}

/* ---- news + questions */
.news{padding:0 0 100px}
.news h2{margin-bottom:34px}
.news-list{display:grid;border-top:2px solid var(--ink)}
.release-row{display:grid;grid-template-columns:200px 1fr;gap:30px;padding:26px 0;border-bottom:1px solid var(--line)}
.release-row .v{font-family:var(--display);font-weight:900;font-size:30px;line-height:1}
.release-row .for{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;color:var(--violet);background:#e9e8ff;border-radius:6px;padding:3px 8px}
.release-row .d{font-size:14px;color:var(--muted);margin-top:6px}
.release-row ul{margin:0;padding-left:18px;color:var(--ink)}
.release-row li{margin:3px 0}
.news-more{display:inline-block;margin-top:22px;color:var(--violet);font-weight:700}
.faq{background:#ecebff;padding:100px 0}
.faq .wrap{display:grid;grid-template-columns:.8fr 1.4fr;gap:60px}
.faq details{border-bottom:1px solid var(--line);padding:4px 0}
.faq summary{list-style:none;cursor:pointer;font:800 19px/1.35 var(--display);padding:16px 40px 16px 0;position:relative}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"";position:absolute;right:6px;top:22px;width:12px;height:12px;border-right:2.5px solid var(--violet);border-bottom:2.5px solid var(--violet);transform:rotate(45deg);transition:transform .2s}
.faq details[open] summary::after{transform:rotate(-135deg);top:28px}
.faq details p{padding:0 0 18px;color:var(--muted)}
.faq .help{margin-top:26px;color:var(--muted)}
.faq .help a{color:var(--violet);font-weight:700}


/* ---- smaller screens */
@media (max-width:980px){
  .hero{padding:120px 0 80px}
  .hero .wrap,.together .wrap,.tour .wrap,.faq .wrap{grid-template-columns:1fr;gap:46px}
  .devices .intro{flex-direction:column;align-items:start}
  .row{grid-template-columns:1fr}
  .device,.device + .device{padding:28px 0;border-left:0;border-top:1px solid var(--line)}
  .device:first-child{border-top:0}
  .stage{position:static}
  .more{grid-template-columns:1fr 1fr}
  .release-row{grid-template-columns:1fr;gap:12px}
}
@media (max-width:560px){
  .chip{font-size:12px;padding:8px 10px;max-width:200px}
  .chip b{font-size:14px}
  .chip i{width:110px}
  .hero .actions .btn{width:100%;justify-content:center}
  .card.later{margin-left:0}
  .more{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <a class="brand" href="/" aria-label="Zono">
      <svg viewBox="0 0 1024 1024" aria-hidden="true"><rect x="64" y="64" width="896" height="896" rx="245" fill="#5350f6"/><path d="M304 340H715V438L449 697H718V798H301V696L568 438H304Z" fill="#fff"/><circle cx="749" cy="770" r="49" fill="#ffd365"/></svg>
      zono <small>tv</small>
    </a>
    <nav class="nav" aria-label="Menu">
      <a href="/#toestellen" data-s="navDevices"></a>
      <a href="/#samen" data-s="navTogether"></a>

        <li><button type="button" data-lang="nl">Nederlands</button></li>

      </ul>

</header>

<main id="top">
  <section class="hero">
    <div class="wrap">
      <div>
        <h1><span data-t="h1a"></span><span data-t="h1b"></span></h1>
        <p class="lead" data-t="lead"></p>
        <div class="actions">
          <a class="btn sun" href="https://github.com/scoutr2019/zono/releases/download/v2.3.8/Zono-Setup.zip" data-download>
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 5.5 10 4.5v7H3zm8-1.1L21 3v8.5H11zM3 12.5h7v7l-7-1zm8 0h10V21l-10-1.4z"/></svg>
            <span data-t="getWindows"></span></a>
          <a class="btn line" href="apps/">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4" width="19" height="13" rx="2.5"/><path d="M8 21h8M12 17v4"/></svg>
            <span data-t="getTv"></span></a>
        </div>
        <p class="release" id="release"></p>
        <p class="note" data-t="playerOnly"></p>
      </div>
      <div class="screens" id="screens" aria-hidden="true">
        <div class="tv"><div class="panel"><img id="tv-shot" alt="" width="1600" height="900"><img id="tv-next" class="next" alt="" width="1600" height="900"></div><div class="foot"></div></div>
        <div class="laptop"><div class="lid"><img id="pc-shot" alt="" width="1672" height="941"></div><div class="base"></div></div>
        <svg class="trail" viewBox="0 0 560 475">
          <defs><radialGradient id="glow"><stop offset="0" stop-color="#ffd34d" stop-opacity=".7"/><stop offset="1" stop-color="#ffd34d" stop-opacity="0"/></radialGradient></defs>
          <path d="M 120 330 C 220 170 360 110 470 175"/>
          <g id="dot" opacity="0"><circle r="22" fill="url(#glow)"/><circle r="8" fill="#ffd34d"/>
            <animateMotion id="move" dur="2.2s" begin="indefinite" fill="freeze" path="M 120 330 C 220 170 360 110 470 175" calcMode="spline" keyTimes="0;1" keySplines=".55 0 .25 1"/>
            <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.9;1" dur="2.2s" begin="move.begin" fill="freeze"/></g>
        </svg>
        <div class="chip from"><div><b>Noorderlicht</b><span data-t="chipPc"></span><i></i></div></div>
        <div class="chip to"><div><b>Noorderlicht</b><span data-t="chipTv"></span><i></i></div></div>
      </div>
    </div>
  </section>

  <section class="devices" id="toestellen">
    <div class="wrap">
      <div class="intro"><h2 data-t="devicesTitle"></h2><p data-t="devicesLead"></p></div>
      <div class="row reveal">
        <div class="device">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M1.5 19.5h21"/></svg>
          <h3>Windows</h3>
          <p data-t="winText"></p>
          <div class="version" id="v-windows"></div>
          <div class="btns"><a class="btn violet" href="https://github.com/scoutr2019/zono/releases/download/v2.3.8/Zono-Setup.zip" data-download data-t="download"></a><a class="btn quiet" href="#vragen" data-open="0" data-t="howTo"></a></div>
        </div>
        <div class="device">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4" width="19" height="13" rx="2.5"/><path d="M7 21h10"/><circle cx="12" cy="10.5" r="3"/></svg>
          <h3>LG</h3>
          <p data-t="lgText"></p>
          <div class="version" id="v-lg"></div>
          <div class="btns"><a class="btn violet" href="lg/" data-t="download"></a><a class="btn quiet" href="apps/#lg" data-t="howTo"></a></div>
        </div>
        <div class="device">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4" width="19" height="13" rx="2.5"/><path d="M8 21h8M12 17v4"/></svg>
          <h3>Android TV</h3>
          <p data-t="androidText"></p>
          <div class="version" id="v-android"></div>
          <div class="btns"><a class="btn violet" href="apk/" data-t="download"></a><a class="btn quiet" href="apps/#android" data-t="howTo"></a></div>
        </div>
      </div>
    </div>
  </section>

  <section class="together" id="samen">
    <div class="wrap">
      <div>
        <h2 data-t="togetherTitle"></h2>
        <p class="lead" data-t="togetherLead"></p>
        <ul>
          <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg><span data-t="t1"></span></li>
          <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg><span data-t="t2"></span></li>
          <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span data-t="t3"></span></li>
        </ul>
      </div>
      <div class="handoff" aria-hidden="true">
        <div class="link"></div>

  document.querySelectorAll("[data-shot]").forEach(function (b) {
    var on = +b.getAttribute("data-shot") === shot;
    b.setAttribute("aria-pressed", String(on));
    var timer = b.nextElementSibling; if (timer) { timer.style.animation = "none"; void timer.offsetWidth; timer.style.animation = ""; }
  });
  if (img.getAttribute("src") === url) return;
  img.classList.add("fade");
  var next = new Image();
  next.onload = next.onerror = function () { img.src = url; img.alt = "Zono: " + s[1]; img.classList.remove("fade"); };
  next.src = url;
}
/* the tour plays by itself (5 s per screen) until you pick one */
var tourTimer = null, tourStopped = false;
function stopTour() { tourStopped = true; clearInterval(tourTimer); document.querySelector(".tour").classList.add("stopped"); }
function startTour() {
  if (tourStopped || tourTimer || (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches)) return;
  tourTimer = setInterval(function () { shot = (shot + 1) % T[lang].tour.length; showShot(); }, 5000);
}
function versions() {
  var t = T[lang];
  if (windows) {
    var v = String(windows.tag_name).replace(/^v/i, ""), line = fill(t.version, v, when(windows.published_at));
    document.getElementById("v-windows").textContent = line;
    document.getElementById("release").textContent = "Windows " + line.charAt(0).toLowerCase() + line.slice(1);
  }
  if (tv) {
    var tvLine = fill(t.version, tv.version, when(tv.date + "T12:00:00"));
    document.getElementById("v-lg").textContent = tvLine;
    document.getElementById("v-android").textContent = tvLine;
  }
}
/* release text: bullets per language under "### NL" or "### Nederlands" (and FR, EN, DE) */
function bullets(body) {
  var parts = {}, plain = [], current = null, names = { nederlands: "nl", "français": "fr", francais: "fr", english: "en", deutsch: "de" };
  String(body || "").split(/\r?\n/).forEach(function (line) {
    var head = line.match(/^#{1,4}\s*(NL|FR|EN|DE|Nederlands|Fran[cç]ais|English|Deutsch)\b/i);
    if (head) { current = names[head[1].toLowerCase()] || head[1].toLowerCase(); parts[current] = parts[current] || []; return; }
    var item = line.match(/^\s*[-*]\s+(.+)/);
    if (item) { var text = item[1].replace(/\*\*|__|`/g, "").replace(/\[([^\]]+)\]\([^)]+\)/g, "$1").trim(); (current ? parts[current] : plain).push(text); }
  });
  return (parts[lang] && parts[lang].length ? parts[lang] : parts.nl && parts.nl.length ? parts.nl : plain).slice(0, 6);
}
function news() {
  var list = document.getElementById("news-list"), t = T[lang];
  if (!releases.length) return;
  list.textContent = "";
  releases.forEach(function (r, i) {
    var items = bullets(r.body); if (!items.length) return;
    var tag = String(r.tag_name || ""), names = (r.assets || []).map(function (a) { return a.name; }).join(" ");
    var hasWin = /Zono\.exe|Setup/i.test(names), hasTv = /Zono-TV/i.test(names) || /\btv\b/i.test(tag + " " + (r.name || ""));
    var number = /^v?\d/.test(tag) ? tag.replace(/^v/i, "").replace(/-.*$/, "") : ((String(r.name || "").match(/\d+(\.\d+)+/) || [tag])[0]);
    var row = document.createElement("article"); row.className = "release-row";
    var side = document.createElement("div");
    side.innerHTML = '<div class="v"></div><span class="for"></span><div class="d"></div>';
    side.querySelector(".v").textContent = number;
    side.querySelector(".for").textContent = hasWin && hasTv ? t.forAll : hasTv ? t.forTv : t.forWin;
    side.querySelector(".d").textContent = when(r.published_at) + (i === 0 ? " · " + t.latest : "");
    var ul = document.createElement("ul");
    items.forEach(function (text) { var li = document.createElement("li"); li.textContent = text; ul.appendChild(li); });
    row.appendChild(side); row.appendChild(ul); list.appendChild(row);
  });
  document.getElementById("nieuw").hidden = !list.children.length;
}
(function () {
  Site.start(function (next) { lang = T[next] ? next : "nl"; render(); });
  // the yellow dot travels once, when the screens are in view
  var screens = document.getElementById("screens");
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(function (seen, obs) { if (seen[0].isIntersecting) { play(); obs.disconnect(); } }, { threshold: .4 }).observe(screens);
  } else play();
  function play() {
    screens.classList.add("play");
    var still = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches, move = document.getElementById("move");
    if (!still && move && move.beginElement) setTimeout(function () { move.beginElement(); }, 1300);
    if (!still) setTimeout(function () { document.querySelector(".chip.to").classList.add("go"); cycleTv(); }, 3600);
  }
  /* after the dot arrived, the tv shows a few more Zono screens, one after the other */
  function cycleTv() {
    var names = ["discover", "live", "guide", "fullscreen"], at = 0, front = document.getElementById("tv-next");
    setInterval(function () {
      if (document.hidden) return;
      at = (at + 1) % names.length;
      var url = PICS + lang + "/" + names[at] + ".jpg", pre = new Image();
      pre.onload = function () {
        if (front.classList.contains("on")) { document.getElementById("tv-shot").src = url; front.classList.remove("on"); }
        else { front.src = url; front.classList.add("on"); }
      };
      pre.src = url;
    }, 3800);
  }
  // sections that move when you scroll to them
  var watch = function (el, then) {
    if (!el) return;
    if (!("IntersectionObserver" in window)) { el.classList.add("seen"); if (then) then(); return; }
    new IntersectionObserver(function (seen, obs) { if (seen[0].isIntersecting) { el.classList.add("seen"); if (then) then(); obs.disconnect(); } }, { threshold: .25 }).observe(el);
  };
  document.querySelectorAll(".reveal").forEach(function (el) { watch(el); });
  watch(document.querySelector(".together"));
  watch(document.querySelector(".tour"), startTour);

  // the newest release WITH the Windows file (TV-only releases have none), and the TV version
  fetch("https://api.github.com/repos/scoutr2019/zono/releases?per_page=20", { headers: { Accept: "application/vnd.github+json" } })
    .then(function (r) { return r.ok ? r.json() : []; }).then(function (list) {
      list = (Array.isArray(list) ? list : []).filter(function (r) { return !r.draft && !r.prerelease; });
      releases = list.slice(0, 5);
      var file = function (r) { return (r.assets || []).filter(function (a) { return a.name === "Zono-Setup.zip"; })[0]; };
      windows = list.filter(file)[0] || null;
      if (windows) document.querySelectorAll("a[data-download]").forEach(function (a) { a.href = file(windows).browser_download_url; });
      versions(); news();
    }).catch(function () {});
  fetch("https://raw.githubusercontent.com/scoutr2019/zono/main/tv/version.json", { cache: "no-store" })
    .then(function (r) { return r.ok ? r.json() : null; }).then(function (v) { if (v && v.version) { tv = v; versions(); } }).catch(function () {});
})();
