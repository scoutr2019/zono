<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920">
  <title>Zono</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"></div>
  <div id="player" hidden>
    <video id="video" playsinline></video>
    <div id="spinner" class="spinner" hidden></div>
    <div id="subline" class="subline" hidden></div>
    <div id="livebar" class="livebar"></div>
    <div id="banner" class="banner"><div id="banner-title"></div><div id="banner-info"></div></div>
    
    <div id="bar" class="bar">
      <div class="bar-times"><span id="bar-now"></span><span id="bar-hint"></span><span id="bar-end"></span></div>
      <div class="bar-track"><div id="bar-fill"></div></div>
    </div>
  </div>
  <div id="numbox" class="numbox"></div>
  <div id="sheet" class="sheet" hidden></div>
  <div id="toast" class="toast"></div>
  <script src="js/vendor/nacl.min.js"></script>
  <script src="js/vendor/qrcode.js"></script>
  <script src="js/strings.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/guide.js"></script>
  <script src="js/countries.js"></script>
  <script src="js/native.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
